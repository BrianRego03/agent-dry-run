spring:
  application:
    name: agentdryrun
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true

  ai:
    model:
      chat:none

  app:
    jwt:
      secret: ${JWT_SECRET}
      accessTokenExpiration: 900
      refreshTokenExpiration: 604800
